name: snaphunt
description: "An AI-driven scavenger hunt app built with Flutter"
publish_to: 'none'
flutter pubversion: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.7.0
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  provider: ^6.1.2
  geolocator: ^10.1.0
  permission_handler: ^12.0.1
  camera: ^0.11.2
  path_provider: ^2.1.2

  # Firebase
  firebase_core: ^2.31.0
  cloud_firestore: ^4.17.3
  firebase_storage: ^11.7.1

  # Local storage / utils
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.1.0

  # Icons
  flutter_svg: ^2.2.0

  # tutorial + remember once
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^2.5.2
  mocktail: ^1.0.2
  firebase_storage_mocks: ^0.6.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  android: true
  ios: false
  web: false

  fullscreen: true
  color: "#100A1E"
  image: assets/brand/snaphunt_splash_screen.png

  android_12:
    color: "#100A1E"
    # On Android 12, this must be an icon-like asset; full posters are not supported by the system splash.
    image: assets/icons/snaphunt_splash_screen.png

flutter_launcher_icons:
  android: "adaptive"
  image_path: "assets/icons/snaphunt_app_icon.png"
  adaptive_icon_foreground: "assets/icons/snaphunt_app_icon.png"
  adaptive_icon_background: "#3E2C8B"


flutter:
  uses-material-design: true
  assets:
    - assets/icons/person-circle.svg
    - assets/icons/book.svg
    - assets/icons/trophy-fill.svg
    - assets/icons/chevron-compact-left.svg
    - assets/icons/camera.svg
    - assets/icons/maps.svg
    - assets/icons/copy.svg
    - assets/icons/map.svg
    - assets/icons/info-circle.svg
    - assets/pictures/picture.png
    - assets/brand/snaphunt_splash_screen.png
    - assets/icons/snaphunt_app_icon.png
